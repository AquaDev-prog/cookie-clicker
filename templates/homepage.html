<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Score display -->
    <h1 id="scoreDisplay">
        Score: {{ score }}
    </h1>

    <!-- CPS + Click worth (optional display) -->
    <p id="cpsDisplay">CPS: {{ cps }}</p>
    <p id="clickWorthDisplay">Click Worth: {{ click_worth }}</p>

    <!-- Top-right buttons -->
    <div style="position: absolute; top: 20px; right: 20px;">
        <a href="{{ url_for('upgrade_shop') }}">
            <button class="shop-button">Upgrades</button>
        </a>

        <a href="{{ url_for('logout') }}">
            <button class="logout-button">Logout</button>
        </a>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboardBox" style="position: absolute; top: 160px; left: 20px; text-align:left;">
        <h3>Top Players</h3>
        <ul id="leaderboardList"></ul>
    </div>

    <!-- Big cookie center -->
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
        <button class="cookie-button" id="cookieBtn"></button>
    </div>

    <!-- JS: handle manual click without reload -->
    <script>
    document.getElementById("cookieBtn").addEventListener("click", () => {
        fetch("/click", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                const scoreEl = document.getElementById("scoreDisplay");
                if (scoreEl) {
                    scoreEl.innerText = "Score: " + data.score;
                }
            })
            .catch(err => console.error("Error clicking cookie:", err));
    });
    </script>

    <!-- Auto-refresh score via JS (also applies autoclick) -->
    <script>
    function refreshScore() {
        fetch("/get_score")
            .then(response => response.json())
            .then(data => {
                const scoreEl = document.getElementById('scoreDisplay');
                const cpsEl = document.getElementById('cpsDisplay');
                const cwEl = document.getElementById('clickWorthDisplay');

                if (scoreEl) {
                    scoreEl.innerText = "Score: " + data.score;
                }
                if (cpsEl) {
                    cpsEl.innerText = "CPS: " + data.cps;
                }
                if (cwEl) {
                    cwEl.innerText = "Click Worth: " + data.click_worth;
                }
            })
            .catch(err => console.error('Error fetching score:', err));
    }

    setInterval(refreshScore, 1000);
    refreshScore();
    </script>

    <!-- Leaderboard JS -->
    <script>
    function updateLeaderboard() {
        fetch('/get_leaderboard')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('leaderboardList');
                list.innerHTML = "";

                data.players.forEach((player, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. ${player.username} - ${player.score}`;
                    list.appendChild(li);
                });
            });
    }
    // Update leaderboard every 14 minutes
    setInterval(updateLeaderboard, 840000);
    updateLeaderboard();
    </script>

</body>
</html>
</body>
</html>
